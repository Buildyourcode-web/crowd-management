version: "3.9"

# ══════════════════════════════════════════════════════════════════════
# Temple AI Crowd Management System — Docker Compose
# Usage:
#   Local:  docker-compose up
#   AWS:    docker-compose -f docker-compose.yml up -d
# ══════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: temple_postgres
    restart: always
    environment:
      POSTGRES_DB: temple_crowd_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: temple_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: temple_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: temple_crowd_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://localhost:8080,http://frontend:8080"
    volumes:
      - ./backend/models:/app/models       # YOLO model mount
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]            # GPU support (AWS g4dn)

  # ── Laravel Frontend ──────────────────────────────────────────────
  frontend:
    image: php:8.2-apache
    container_name: temple_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/html
    environment:
      FASTAPI_BASE_URL: http://backend:8000/api/v1
      AI_CROWD_API_URL: http://backend:8000
      AI_CROWD_MOCK_MODE: "false"
    depends_on:
      - backend

  # ── Nginx Reverse Proxy (Production) ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: temple_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl                # SSL certificates
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
