version: "3.8"

# ══════════════════════════════════════════════════════════════════════
# Temple AI Crowd Management System — Supabase Cloud Docker Compose
# ══════════════════════════════════════════════════════════════════════

services:

  # ── Redis (In-Memory Pub/Sub & Caching) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: temple_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (AI Analytics & Supabase Database) ─────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: temple_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      SUPABASE_DATABASE_URL: "postgresql://postgres:Ramkumar%40039@db.mtysplndnfjssgqvomkh.supabase.co:5432/postgres"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: '["*"]'
    volumes:
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  # ── React Frontend (Web Dashboard & CCTV Wall) ────────────────────
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: temple_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
